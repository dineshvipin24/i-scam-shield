<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Protect — AI Scam Shield Web Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        darkCard: '#111726',
                        darkBorder: '#1e293b',
                        safe: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #060913;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="text-slate-100 min-height-screen">

    <div id="root"></div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DEMO_TRANSCRIPTS = [
            {
                title: "OTP Verification Scam (High Risk)",
                category: "OTP Scam",
                text: "Hello, this is SBI customer service support department calling. We have detected a suspicious transaction of rupees 50000 on your account. To freeze the transaction and protect your fund, we have sent a 6-digit verification OTP code to your register phone number. Please read back the OTP code immediately to avoid account block."
            },
            {
                title: "Remote Access Threat (High Risk)",
                category: "Remote Access Scam",
                text: "I am calling from technical service support. Your computer security registry has been compromised by malware. To prevent identity leak, install AnyDesk or TeamViewer app from Google Play Store right now to let us clear the registry. Do not close the app or you will face permanent system damage."
            },
            {
                title: "Police Arrest Scare (High Risk)",
                category: "Government Scam",
                text: "This is inspector Sharma calling from CBI headquarters. Your Aadhaar card and PAN details were found in a money laundering case. A court warrant has been issued. You must deposit 1 lakh rupees processing fee immediately to verify your account or the police department will arrest you within 2 hours."
            },
            {
                title: "Fake Job Offer (Medium Risk)",
                category: "Job Scam",
                text: "Congratulations! Your profile is shortlisted for a work from home part-time job. You can earn 5000 rupees daily by just reviewing products. To activate your account and start your task, you need to pay a small refundable registration fee of 999 rupees today."
            },
            {
                title: "Legitimate Courier Call (Safe)",
                category: "Safe Call",
                text: "Hello, I am calling from BlueDart courier service. I have your parcel from Amazon. Are you available at your home address right now to receive it, or should I leave it with the security guard at the gate?"
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('live');
            const [selectedDemo, setSelectedDemo] = useState(0);
            const [pastedText, setPastedText] = useState('');
            const [audioFile, setAudioFile] = useState(null);
            const [analysisResult, setAnalysisResult] = useState(null);
            const [loading, setLoading] = useState(false);
            
            // Microphone States
            const [isListening, setIsListening] = useState(false);
            const [micTranscript, setMicTranscript] = useState([]);
            const [micKeywords, setMicKeywords] = useState([]);
            const [micRiskScore, setMicRiskScore] = useState(0);
            const [micRiskLevel, setMicRiskLevel] = useState('SAFE');
            const [micCategory, setMicCategory] = useState('Safe Call');
            const [alertShown, setAlertShown] = useState(false);
            const recognitionRef = useRef(null);

            // History & Stats
            const [history, setHistory] = useState([]);
            const [stats, setStats] = useState({ total_calls: 0, blocked_calls: 0, safe_calls: 0, suspicious_calls: 0, fraud_calls: 0 });

            useEffect(() => {
                fetchHistory();
                fetchStats();
                // Initialize Lucide icons after mount
                if (window.lucide) window.lucide.createIcons();
            }, [activeTab]);

            const fetchHistory = () => {
                fetch('/api/calls')
                    .then(res => res.json())
                    .then(data => setHistory(data))
                    .catch(e => console.error("Error fetching history", e));
            };

            const fetchStats = () => {
                fetch('/api/stats')
                    .then(res => res.json())
                    .then(data => setStats(data))
                    .catch(e => console.error("Error fetching stats", e));
            };

            // Analyze Pasted Text
            const handleAnalyzeText = (textToAnalyze) => {
                const text = textToAnalyze || pastedText;
                if (!text.trim()) return;
                setLoading(true);
                fetch('/api/analyze-text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                })
                .then(res => res.json())
                .then(data => {
                    setAnalysisResult(data);
                    setLoading(false);
                })
                .catch(e => {
                    console.error(e);
                    setLoading(false);
                });
            };

            // Analyze Audio File
            const handleAnalyzeAudio = (e) => {
                e.preventDefault();
                if (!audioFile) return;
                setLoading(true);
                const formData = new FormData();
                formData.append('file', audioFile);

                fetch('/api/analyze-audio', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    setAnalysisResult(data);
                    setLoading(false);
                })
                .catch(e => {
                    console.error(e);
                    setLoading(false);
                });
            };

            // Live Mic Logic
            const toggleMic = () => {
                if (isListening) {
                    stopListening();
                } else {
                    startListening();
                }
            };

            const startListening = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Microphone Speech Recognition is not supported by your browser. Please use Chrome or Edge.");
                    return;
                }
                const rec = new SpeechRecognition();
                rec.continuous = true;
                rec.interimResults = true;
                rec.lang = "en-IN";
                recognitionRef.current = rec;

                rec.onstart = () => {
                    setIsListening(true);
                    setMicTranscript([]);
                    setMicKeywords([]);
                    setMicRiskScore(0);
                    setMicRiskLevel('SAFE');
                    setMicCategory('Safe Call');
                    setAlertShown(false);
                };

                rec.onresult = (event) => {
                    let finalResult = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalResult = event.results[i][0].transcript.trim();
                        }
                    }
                    if (!finalResult) return;

                    setMicTranscript(prev => {
                        const updated = [...prev, finalResult];
                        const rollingText = updated.join(" ");
                        
                        // Local quick scoring simulation
                        fetch('/api/analyze-text', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: rollingText })
                        })
                        .then(res => res.json())
                        .then(data => {
                            setMicRiskScore(data.risk_score);
                            setMicRiskLevel(data.risk_level);
                            setMicCategory(data.fraud_category);
                            setMicKeywords(data.detected_keywords || []);
                            
                            // Immediately alert on risk level threshold cross
                            if (data.risk_level === 'HIGH' && !alertShown) {
                                setAlertShown(true);
                                playBeep(1000, 0.15, 3, 100); // 3 rapid high alert beeps
                            } else if (data.risk_level === 'MEDIUM' && !alertShown) {
                                playBeep(700, 0.2, 2, 200); // 2 warning beeps
                            }
                        });
                        return updated;
                    });
                };

                rec.onerror = (e) => {
                    console.error("Speech recognition error", e);
                    stopListening();
                };

                rec.onend = () => {
                    if (isListening) rec.start();
                };

                rec.start();
            };

            const stopListening = () => {
                setIsListening(false);
                if (recognitionRef.current) {
                    recognitionRef.current.stop();
                    recognitionRef.current = null;
                }
            };

            const playBeep = (freq, duration, count = 1, interval = 150) => {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    let currentCount = 0;
                    
                    const triggerSingleBeep = () => {
                        if (currentCount >= count) return;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                        osc.start();
                        osc.stop(audioCtx.currentTime + duration);
                        currentCount++;
                        setTimeout(triggerSingleBeep, interval);
                    };
                    
                    triggerSingleBeep();
                } catch (e) {
                    console.error("Audio error", e);
                }
            };

            // Periodic geiger warning beep during active risk calls
            useEffect(() => {
                let intervalId = null;
                if (isListening && (micRiskLevel === 'HIGH' || micRiskLevel === 'MEDIUM')) {
                    const freq = micRiskLevel === 'HIGH' ? 950 : 650;
                    const count = micRiskLevel === 'HIGH' ? 2 : 1;
                    intervalId = setInterval(() => {
                        playBeep(freq, 0.12, count, 100);
                    }, 2500); // Repeat alert every 2.5 seconds
                }
                return () => {
                    if (intervalId) clearInterval(intervalId);
                };
            }, [isListening, micRiskLevel]);

            // Color Class helpers
            const getRiskColorClass = (score) => {
                if (score >= 61) return 'text-rose-400 border-rose-500/20 bg-rose-500/5 shadow-rose-500/10';
                if (score >= 31) return 'text-amber-400 border-amber-500/20 bg-amber-500/5 shadow-amber-500/10';
                return 'text-emerald-400 border-emerald-500/20 bg-emerald-500/5 shadow-emerald-500/10';
            };

            const getRiskBadge = (level) => {
                if (level === 'HIGH') return 'bg-red-500/20 text-red-400 border border-red-500/40';
                if (level === 'MEDIUM') return 'bg-amber-500/20 text-amber-400 border border-amber-500/40';
                return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
            };

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Header */}
                    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">🛡️</span>
                            <div>
                                <h1 class="text-xl font-bold tracking-tight text-white">CAMP PROTECT</h1>
                                <p class="text-xs text-slate-400">AI Real-time Scam Detector Web Platform</p>
                            </div>
                        </div>
                        <div class="flex gap-2 text-xs">
                            <span class="px-3 py-1 bg-slate-800 rounded-full border border-slate-700">Database: SQLite (Demo Mode)</span>
                            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full">Server Status: Online</span>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div class="flex justify-center bg-slate-950 border-b border-slate-900 px-6 py-3 gap-4">
                        <button onClick={() => { setActiveTab('live'); setAnalysisResult(null); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'live' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>🎙️ Live Mic Monitor</button>
                        <button onClick={() => { setActiveTab('audio'); setAnalysisResult(null); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'audio' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>📁 Upload Audio File</button>
                        <button onClick={() => { setActiveTab('transcript'); setAnalysisResult(null); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'transcript' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>📝 Paste Transcript</button>
                        <button onClick={() => { setActiveTab('history'); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'history' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>📊 Call Logs & History</button>
                        <button onClick={() => { setActiveTab('analytics'); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'analytics' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>📈 System Analytics</button>
                    </div>

                    {/* Main Layout Grid */}
                    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* LEFT: Input Column */}
                        <div class="lg:col-span-7 flex flex-col gap-6">
                            
                            {/* Tab 1: Live Mic Monitor */}
                            {activeTab === 'live' && (
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                                    <h2 class="text-lg font-bold">🎙️ Continuous Offline Speech Monitoring</h2>
                                    <p class="text-sm text-slate-400">
                                        Click <strong>Start Listening</strong> and speak in Hindi or English (mixed Hinglish supported). The offline AI scanner will transcribe your voice and check threat metrics in real-time.
                                    </p>
                                    
                                    <div class="flex items-center gap-4 mt-2">
                                        <button onClick={toggleMic} class={`flex-1 py-4 px-6 rounded-xl font-bold flex items-center justify-center gap-3 transition-all ${isListening ? 'bg-red-500 hover:bg-red-600 text-white animate-pulse' : 'bg-blue-500 hover:bg-blue-600 text-slate-950'}`}>
                                            <span>{isListening ? '⏹️ Stop Listening' : '🎙️ Start Listening'}</span>
                                        </button>
                                        <span class={`px-3 py-1 rounded-full text-xs font-bold ${isListening ? 'bg-red-500/20 text-red-400' : 'bg-slate-800 text-slate-400'}`}>
                                            {isListening ? '● LISTENING' : '● IDLE'}
                                        </span>
                                    </div>

                                    {/* Mic Live Transcript Viewer */}
                                    <div class="mt-4">
                                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Live Transcript View</h3>
                                        <div class="bg-slate-950 rounded-xl p-4 h-64 overflow-y-auto border border-slate-900 flex flex-col gap-2">
                                            {micTranscript.length === 0 ? (
                                                <div class="text-slate-600 text-center py-20 text-sm">Waiting for speech... Speak now!</div>
                                            ) : (
                                                micTranscript.map((t, idx) => (
                                                    <div key={idx} class="text-sm border-l-2 border-slate-700 pl-3 py-1 text-slate-300">"{t}"</div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Tab 2: Upload Audio File */}
                            {activeTab === 'audio' && (
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                                    <h2 class="text-lg font-bold">📁 Batch Speech-to-Text Upload</h2>
                                    <p class="text-sm text-slate-400">Upload recorded call files (.wav, .mp3, .m4a) to convert speech to text and run threat analytics.</p>
                                    
                                    <form onSubmit={handleAnalyzeAudio} class="flex flex-col gap-4">
                                        <div class="border-2 border-dashed border-slate-700 hover:border-slate-500 rounded-xl p-8 flex flex-col items-center justify-center gap-2 cursor-pointer transition-all bg-slate-950/40">
                                            <span class="text-4xl mb-2">📥</span>
                                            <input type="file" accept="audio/*" onChange={(e) => setAudioFile(e.target.files[0])} class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700" />
                                            <span class="text-xs text-slate-500">Supports WAV, MP3, M4A, OGG</span>
                                        </div>

                                        <button type="submit" disabled={!audioFile || loading} class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition-all disabled:opacity-50">
                                            {loading ? 'Analyzing with Whisper STT...' : 'Run Audio Transcription'}
                                        </button>
                                    </form>
                                </div>
                            )}

                            {/* Tab 3: Paste Transcript */}
                            {activeTab === 'transcript' && (
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                                    <h2 class="text-lg font-bold">📝 Pasted Transcript Evaluation</h2>
                                    <p class="text-sm text-slate-400">Select one of our pre-compiled scam templates or write/paste a custom transcript.</p>
                                    
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-2">
                                        {DEMO_TRANSCRIPTS.map((demo, idx) => (
                                            <button key={idx} onClick={() => { setPastedText(demo.text); handleAnalyzeText(demo.text); }} class="text-left px-3 py-2 bg-slate-950/40 border border-slate-800 rounded-lg hover:bg-slate-800 text-xs font-medium transition-all text-slate-300">
                                                🎯 {demo.title}
                                            </button>
                                        ))}
                                    </div>

                                    <textarea value={pastedText} onChange={(e) => setPastedText(e.target.value)} placeholder="Type or paste the transcript conversation here..." class="w-full h-40 bg-slate-950 rounded-xl p-4 text-sm text-slate-300 border border-slate-800 focus:outline-none focus:border-slate-700 focus:ring-0 resize-none"></textarea>

                                    <button onClick={() => handleAnalyzeText(null)} disabled={!pastedText.trim() || loading} class="w-full py-3 bg-blue-500 hover:bg-blue-600 text-slate-950 font-bold rounded-xl transition-all disabled:opacity-50">
                                        {loading ? 'Analyzing scam weights...' : 'Run Threat Evaluation'}
                                    </button>
                                </div>
                            )}

                            {/* Tab 4: History Table */}
                            {activeTab === 'history' && (
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <h2 class="text-lg font-bold mb-4">📊 Call History & Threat Logs</h2>
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-left text-sm text-slate-400">
                                            <thead class="bg-slate-950 text-slate-300 font-bold uppercase text-xs tracking-wider border-b border-slate-800">
                                                <tr>
                                                    <th class="py-3 px-4">Caller ID</th>
                                                    <th class="py-3 px-4">Channel Type</th>
                                                    <th class="py-3 px-4">Score</th>
                                                    <th class="py-3 px-4">Category</th>
                                                    <th class="py-3 px-4">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-800/50">
                                                {history.length === 0 ? (
                                                    <tr>
                                                        <td colspan="5" class="py-8 text-center">No evaluations logged yet.</td>
                                                    </tr>
                                                ) : (
                                                    history.map((h, idx) => (
                                                        <tr key={idx} class="hover:bg-slate-800/35">
                                                            <td class="py-3 px-4 text-slate-200 font-medium">{h.from_number}</td>
                                                            <td class="py-3 px-4 text-xs font-semibold">{h.to_number}</td>
                                                            <td class="py-3 px-4">
                                                                <span class={`px-2 py-0.5 rounded text-xs font-bold ${getRiskBadge(h.risk_label.toUpperCase())}`}>
                                                                    {Math.round(h.final_score * 100)}%
                                                                </span>
                                                            </td>
                                                            <td class="py-3 px-4 text-slate-300">{h.action_taken || 'Processed'}</td>
                                                            <td class="py-3 px-4 text-xs font-bold">{h.status.toUpperCase()}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* Tab 5: Analytics Charts */}
                            {activeTab === 'analytics' && (
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                                        <h2 class="text-lg font-bold">🛡️ Security Dashboard Statistics</h2>
                                        <div class="grid grid-cols-2 gap-4 mt-2">
                                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                <span class="text-xs text-slate-400 block mb-1">Evaluated Threats</span>
                                                <span class="text-2xl font-bold text-white">{stats.total_calls}</span>
                                            </div>
                                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                <span class="text-xs text-slate-400 block mb-1">High Risk Blocks</span>
                                                <span class="text-2xl font-bold text-red-500">{stats.blocked_calls + stats.fraud_calls}</span>
                                            </div>
                                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                <span class="text-xs text-slate-400 block mb-1">Medium Suspicious</span>
                                                <span class="text-2xl font-bold text-amber-500">{stats.suspicious_calls}</span>
                                            </div>
                                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                <span class="text-xs text-slate-400 block mb-1">Verified Safe Calls</span>
                                                <span class="text-2xl font-bold text-emerald-500">{stats.safe_calls}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-center items-center">
                                        <h2 class="text-sm font-bold text-slate-400 mb-6 uppercase tracking-wider self-start">Scam Distribution Breakdown</h2>
                                        {stats.total_calls === 0 ? (
                                            <div class="text-slate-600 text-xs py-12">No data logged. Run tests to populate charts.</div>
                                        ) : (
                                            <div class="flex flex-col gap-2 w-full text-xs">
                                                <div class="flex justify-between">
                                                    <span>OTP Scams</span>
                                                    <span class="font-bold text-red-400">{Math.round((stats.fraud_calls / (stats.total_calls || 1)) * 100)}%</span>
                                                </div>
                                                <div class="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden">
                                                    <div class="bg-red-500 h-full" style={{ width: `${(stats.fraud_calls / (stats.total_calls || 1)) * 100}%` }}></div>
                                                </div>
                                                
                                                <div class="flex justify-between mt-2">
                                                    <span>KYC & Banking Scams</span>
                                                    <span class="font-bold text-amber-400">{Math.round((stats.suspicious_calls / (stats.total_calls || 1)) * 100)}%</span>
                                                </div>
                                                <div class="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden">
                                                    <div class="bg-amber-500 h-full" style={{ width: `${(stats.suspicious_calls / (stats.total_calls || 1)) * 100}%` }}></div>
                                                </div>

                                                <div class="flex justify-between mt-2">
                                                    <span>Safe Verified Calls</span>
                                                    <span class="font-bold text-emerald-400">{Math.round((stats.safe_calls / (stats.total_calls || 1)) * 100)}%</span>
                                                </div>
                                                <div class="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden">
                                                    <div class="bg-emerald-500 h-full" style={{ width: `${(stats.safe_calls / (stats.total_calls || 1)) * 100}%` }}></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>

                        {/* RIGHT: Output Gauge & Decision Column */}
                        <div class="lg:col-span-5 flex flex-col gap-6">
                            
                            {/* Real-time Threat Gauge */}
                            {((activeTab === 'live' && isListening) || (activeTab !== 'live' && analysisResult)) ? (
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-6 items-center">
                                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider self-start">🎯 Real-time threat gauge</h2>
                                    
                                    {/* Circular Gauge */}
                                    <div class="relative flex items-center justify-center">
                                        <svg class="w-48 h-48 transform -rotate-90">
                                            <circle cx="96" cy="96" r="80" stroke="#1e293b" stroke-width="12" fill="transparent" />
                                            <circle cx="96" cy="96" r="80" 
                                                stroke={
                                                    (activeTab === 'live' ? micRiskScore : analysisResult?.risk_score) >= 61 ? '#ef4444' : 
                                                    (activeTab === 'live' ? micRiskScore : analysisResult?.risk_score) >= 31 ? '#f59e0b' : '#10b981'
                                                } 
                                                stroke-width="12" 
                                                fill="transparent" 
                                                stroke-dasharray="502" 
                                                stroke-dashoffset={502 - (502 * (activeTab === 'live' ? micRiskScore : analysisResult?.risk_score || 0)) / 100}
                                                class="transition-all duration-700 ease-out" 
                                            />
                                        </svg>
                                        <div class="absolute flex flex-col items-center justify-center">
                                            <span class="text-4xl font-extrabold text-white">
                                                {activeTab === 'live' ? micRiskScore : analysisResult?.risk_score}%
                                            </span>
                                            <span class="text-xs text-slate-500 font-semibold uppercase mt-1">Risk Probability</span>
                                        </div>
                                    </div>

                                    {/* Action Alert Status Block */}
                                    <div class={`w-full p-4 rounded-xl border flex flex-col items-center justify-center text-center transition-all ${getRiskColorClass(activeTab === 'live' ? micRiskScore : analysisResult?.risk_score)}`}>
                                        <span class="text-3xl mb-1">
                                            {(activeTab === 'live' ? micRiskScore : analysisResult?.risk_score) >= 61 ? '🚨' : 
                                             (activeTab === 'live' ? micRiskScore : analysisResult?.risk_score) >= 31 ? '⚠️' : '✅'}
                                        </span>
                                        <h3 class="text-md font-extrabold uppercase tracking-wide">
                                            {activeTab === 'live' ? micRiskLevel : analysisResult?.risk_level} Risk Detected
                                        </h3>
                                        <p class="text-xs opacity-90 mt-1 max-w-xs leading-relaxed">
                                            Category: <strong class="underline">{activeTab === 'live' ? micCategory : analysisResult?.fraud_category}</strong>
                                        </p>
                                    </div>

                                    {/* Keywords Panel */}
                                    <div class="w-full flex flex-col gap-2">
                                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Matched Scam Signatures</span>
                                        <div class="flex flex-wrap gap-1.5 min-h-[36px]">
                                            {(activeTab === 'live' ? micKeywords : analysisResult?.detected_keywords)?.length > 0 ? (
                                                (activeTab === 'live' ? micKeywords : analysisResult?.detected_keywords).map((kw, idx) => (
                                                    <span key={idx} class="px-2.5 py-1 bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg text-xs font-semibold">{kw}</span>
                                                ))
                                            ) : (
                                                <span class="text-slate-600 text-xs">No scam signatures matches found.</span>
                                            )}
                                        </div>
                                    </div>

                                    {/* Evidence report */}
                                    <div class="w-full bg-slate-950 p-4 border border-slate-900 rounded-xl">
                                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Evidence Report</span>
                                        <p class="text-xs text-slate-400 leading-relaxed font-mono">
                                            {activeTab === 'live' 
                                                ? (micRiskScore >= 31 ? `Live conversation matches profile signature of ${micCategory}. Risk evaluation triggered at ${micRiskScore}%.` : 'No prominent threat indicators detected in stream.') 
                                                : analysisResult?.evidence_report}
                                        </p>
                                    </div>
                                </div>
                            ) : (
                                <div class="bg-slate-900/40 border border-slate-800 border-dashed rounded-2xl p-12 text-center text-slate-600 flex flex-col items-center justify-center gap-3">
                                    <span class="text-5xl opacity-40">📊</span>
                                    <div>
                                        <h3 class="text-sm font-bold text-slate-400">Threat Evaluation Pending</h3>
                                        <p class="text-xs text-slate-500 max-w-xs mt-1 leading-relaxed">Select a template or start recording speech to view interactive risk gauges and classifications.</p>
                                    </div>
                                </div>
                            )}

                        </div>

                    </main>

                    {/* Footer */}
                    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500">
                        <p>Camp Protect AI Scam Shield — Engineering Final Year Project. Designed Compliance-First under Android 10-15 Regulations.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
