<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Protect — AI Scam Shield Web Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        darkCard: '#111726',
                        darkBorder: '#1e293b',
                        safe: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #060913;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #090d16;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        .glass-card {
            background: rgba(17, 23, 38, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 0.7);
        }
    </style>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="text-slate-100 min-height-screen">

    <div id="root"></div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DEMO_TRANSCRIPTS = [
            {
                title: "OTP Verification Scam (High Risk)",
                category: "OTP Scam",
                text: "Hello, this is SBI customer service support department calling. We have detected a suspicious transaction of rupees 50000 on your account. To freeze the transaction and protect your fund, we have sent a 6-digit verification OTP code to your register phone number. Please read back the OTP code immediately to avoid account block."
            },
            {
                title: "Remote Access Threat (High Risk)",
                category: "Remote Access Scam",
                text: "I am calling from technical service support. Your computer security registry has been compromised by malware. To prevent identity leak, install AnyDesk or TeamViewer app from Google Play Store right now to let us clear the registry. Do not close the app or you will face permanent system damage."
            },
            {
                title: "Police Arrest Scare (High Risk)",
                category: "Government Scam",
                text: "This is inspector Sharma calling from CBI headquarters. Your Aadhaar card and PAN details were found in a money laundering case. A court warrant has been issued. You must deposit 1 lakh rupees processing fee immediately to verify your account or the police department will arrest you within 2 hours."
            },
            {
                title: "Fake Job Offer (Medium Risk)",
                category: "Job Scam",
                text: "Congratulations! Your profile is shortlisted for a work from home part-time job. You can earn 5000 rupees daily by just reviewing products. To activate your account and start your task, you need to pay a small refundable registration fee of 999 rupees today."
            },
            {
                title: "Legitimate Courier Call (Safe)",
                category: "Safe Call",
                text: "Hello, I am calling from BlueDart courier service. I have your parcel from Amazon. Are you available at your home address right now to receive it, or should I leave it with the security guard at the gate?"
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('live');
            const [selectedDemo, setSelectedDemo] = useState(0);
            const [pastedText, setPastedText] = useState('');
            const [audioFile, setAudioFile] = useState(null);
            const [analysisResult, setAnalysisResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [selectedCall, setSelectedCall] = useState(null);

            // Microphone States
            const [isListening, setIsListening] = useState(false);
            const [micTranscript, setMicTranscript] = useState([]);
            const [micKeywords, setMicKeywords] = useState([]);
            const [micRiskScore, setMicRiskScore] = useState(0);
            const [micRiskLevel, setMicRiskLevel] = useState('SAFE');
            const [micCategory, setMicCategory] = useState('Safe Call');
            const [alertShown, setAlertShown] = useState(false);
            const recognitionRef = useRef(null);

            // High Risk Siren Alarm System
            const alarmTimerRef = useRef(null);
            const alarmStopTimeoutRef = useRef(null);
            const [isAlarmPlaying, setIsAlarmPlaying] = useState(false);
            const [isCallTerminated, setIsCallTerminated] = useState(false);

            // History & Stats
            const [history, setHistory] = useState([]);
            const [stats, setStats] = useState({ total_calls: 0, blocked_calls: 0, safe_calls: 0, suspicious_calls: 0, fraud_calls: 0 });

            useEffect(() => {
                fetchHistory();
                fetchStats();
                if (window.lucide) window.lucide.createIcons();
            }, [activeTab]);

            const fetchHistory = () => {
                fetch('/api/calls')
                    .then(res => res.json())
                    .then(data => setHistory(data))
                    .catch(e => console.error("Error fetching history", e));
            };

            const fetchStats = () => {
                fetch('/api/stats')
                    .then(res => res.json())
                    .then(data => setStats(data))
                    .catch(e => console.error("Error fetching stats", e));
            };

            // Audio Context initialization helper (must be called from a user gesture)
            const initAudioContext = () => {
                if (!window.sharedAudioContext) {
                    window.sharedAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (window.sharedAudioContext.state === 'suspended') {
                    window.sharedAudioContext.resume();
                }
            };

            const playBeep = (freq, duration, count = 1, interval = 150) => {
                try {
                    initAudioContext();
                    const audioCtx = window.sharedAudioContext;
                    let currentCount = 0;

                    const triggerSingleBeep = () => {
                        if (currentCount >= count) return;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                        osc.start();
                        osc.stop(audioCtx.currentTime + duration);
                        currentCount++;
                        setTimeout(triggerSingleBeep, interval);
                    };

                    triggerSingleBeep();
                } catch (e) {
                    console.error("Audio error", e);
                }
            };

            const triggerHighRiskAlarm = () => {
                initAudioContext();
                if (alarmTimerRef.current) return; // already running
                setIsAlarmPlaying(true);
                console.log("[ALARM] Triggering high risk alarm. Will continue for 30s.");

                const playBeepLocal = () => {
                    playBeep(950, 0.25, 2, 120);
                };

                playBeepLocal();
                alarmTimerRef.current = setInterval(playBeepLocal, 1500);

                alarmStopTimeoutRef.current = setTimeout(() => {
                    stopHighRiskAlarm();
                }, 30000);
            };

            const stopHighRiskAlarm = () => {
                setIsAlarmPlaying(false);
                if (alarmTimerRef.current) {
                    clearInterval(alarmTimerRef.current);
                    alarmTimerRef.current = null;
                }
                if (alarmStopTimeoutRef.current) {
                    clearTimeout(alarmStopTimeoutRef.current);
                    alarmStopTimeoutRef.current = null;
                }
                console.log("[ALARM] Alarm stopped.");
            };

            // Analyze Pasted Text
            const handleAnalyzeText = (textToAnalyze) => {
                initAudioContext();
                const text = textToAnalyze || pastedText;
                if (!text.trim()) return;
                setLoading(true);
                fetch('/api/analyze-text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                })
                    .then(res => res.json())
                    .then(data => {
                        setAnalysisResult(data);
                        setLoading(false);
                        if (data.risk_score >= 100) {
                            stopHighRiskAlarm();
                            setIsCallTerminated(true);
                            playBeep(400, 0.5, 3, 200);
                        } else if (data.risk_score >= 70) {
                            setIsCallTerminated(false);
                            triggerHighRiskAlarm();
                        } else {
                            setIsCallTerminated(false);
                        }
                    })
                    .catch(e => {
                        console.error(e);
                        setLoading(false);
                    });
            };

            // Analyze Audio File (Complete Scam + AI Voice Analysis)
            const handleAnalyzeAudio = (e, fileToAnalyze) => {
                if (e) e.preventDefault();
                initAudioContext();
                const file = fileToAnalyze || audioFile;
                if (!file) return;
                setLoading(true);
                const formData = new FormData();
                formData.append('file', file);

                fetch('/api/analyze-complete', {
                    method: 'POST',
                    body: formData
                })
                    .then(res => res.json())
                    .then(data => {
                        setAnalysisResult(data);
                        setLoading(false);
                        const isAudio = !!data?.combined_analysis;
                        const scam = isAudio ? data.scam_analysis.risk_score : (data?.risk_score || 0);
                        const comb = isAudio ? data.combined_analysis.combined_threat_score : scam;
                        if (comb >= 100) {
                            stopHighRiskAlarm();
                            setIsCallTerminated(true);
                            playBeep(400, 0.5, 3, 200);
                        } else if (comb >= 70) {
                            setIsCallTerminated(false);
                            triggerHighRiskAlarm();
                        } else {
                            setIsCallTerminated(false);
                        }
                    })
                    .catch(e => {
                        console.error(e);
                        setLoading(false);
                    });
            };



            // Live Mic Logic
            const toggleMic = () => {
                initAudioContext();
                if (isListening) {
                    stopListening();
                } else {
                    startListening();
                }
            };

            const startListening = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Microphone Speech Recognition is not supported by your browser. Please use Chrome or Edge.");
                    return;
                }
                const rec = new SpeechRecognition();
                rec.continuous = true;
                rec.interimResults = true;
                rec.lang = "en-IN";
                recognitionRef.current = rec;

                rec.onstart = () => {
                    setIsListening(true);
                    setMicTranscript([]);
                    setMicKeywords([]);
                    setMicRiskScore(0);
                    setMicRiskLevel('SAFE');
                    setMicCategory('Safe Call');
                    setAlertShown(false);
                    setIsCallTerminated(false);
                };

                rec.onresult = (event) => {
                    let finalResult = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalResult = event.results[i][0].transcript.trim();
                        }
                    }
                    if (!finalResult) return;

                    setMicTranscript(prev => {
                        const updated = [...prev, finalResult];
                        const rollingText = updated.join(" ");

                        fetch('/api/analyze-text', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: rollingText })
                        })
                            .then(res => res.json())
                            .then(data => {
                                setMicRiskScore(data.risk_score);
                                setMicRiskLevel(data.risk_level);
                                setMicCategory(data.fraud_category);
                                setMicKeywords(data.detected_keywords || []);

                                if (data.risk_score >= 100) {
                                    stopListening();
                                    stopHighRiskAlarm();
                                    setIsCallTerminated(true);
                                    playBeep(400, 0.5, 3, 200);
                                } else if (data.risk_score >= 70 || data.risk_level === 'HIGH') {
                                    triggerHighRiskAlarm();
                                }
                            });
                        return updated;
                    });
                };

                rec.onerror = (e) => {
                    console.error("Speech recognition error", e);
                    stopListening();
                };

                rec.onend = () => {
                    if (isListening) rec.start();
                };

                rec.start();
            };

            const stopListening = () => {
                setIsListening(false);
                if (recognitionRef.current) {
                    recognitionRef.current.stop();
                    recognitionRef.current = null;
                }
            };

            // Non-critical medium risk background chime logic
            useEffect(() => {
                let intervalId = null;
                const score = activeTab === 'live' ? micRiskScore : 0;
                const isMedium = score >= 31 && score < 70;

                if (isListening && isMedium) {
                    intervalId = setInterval(() => {
                        playBeep(700, 0.15, 1, 100);
                    }, 3000);
                }
                return () => {
                    if (intervalId) clearInterval(intervalId);
                };
            }, [isListening, micRiskScore, activeTab]);

            // Normalized Analysis Mapping
            const isAudioAnalysis = !!analysisResult?.combined_analysis;

            const scamScore = isAudioAnalysis ? analysisResult.scam_analysis.risk_score : (analysisResult?.risk_score || 0);
            const scamRiskLevel = isAudioAnalysis ? analysisResult.scam_analysis.risk_level : (analysisResult?.risk_level || 'SAFE');
            const scamCategory = isAudioAnalysis ? analysisResult.scam_analysis.fraud_category : (analysisResult?.fraud_category || 'Safe Call');
            const scamEvidence = isAudioAnalysis ? analysisResult.scam_analysis.evidence_report : (analysisResult?.evidence_report || '');
            const scamKeywords = isAudioAnalysis ? analysisResult.scam_analysis.detected_keywords : (analysisResult?.detected_keywords || []);
            const scamTranscript = isAudioAnalysis ? analysisResult.scam_analysis.transcript : (analysisResult?.transcript || '');

            const voiceScore = isAudioAnalysis ? analysisResult.voice_analysis.ai_voice_score : 0;
            const voiceClass = isAudioAnalysis ? analysisResult.voice_analysis.voice_classification : 'Uncertain';
            const voiceConfidence = isAudioAnalysis ? analysisResult.voice_analysis.confidence_score : 0;
            const voiceHumanProb = isAudioAnalysis ? analysisResult.voice_analysis.human_voice_probability : 100;
            const voiceAIProb = isAudioAnalysis ? analysisResult.voice_analysis.ai_voice_probability : 0;
            const voiceFeatures = isAudioAnalysis ? analysisResult.voice_analysis.features : null;
            const voiceReasoning = isAudioAnalysis ? analysisResult.voice_analysis.reasoning : '';

            const combinedScore = isAudioAnalysis ? analysisResult.combined_analysis.combined_threat_score : scamScore;
            const combinedRiskLevel = isAudioAnalysis ? analysisResult.combined_analysis.combined_risk_level : scamRiskLevel;

            // Color Class helpers
            const getRiskColorClass = (score) => {
                if (score >= 70) return 'text-rose-400 border-rose-500/20 bg-rose-500/5 shadow-rose-500/10';
                if (score >= 31) return 'text-amber-400 border-amber-500/20 bg-amber-500/5 shadow-amber-500/10';
                return 'text-emerald-400 border-emerald-500/20 bg-emerald-500/5 shadow-emerald-500/10';
            };

            const getRiskBadge = (level) => {
                if (level === 'HIGH' || level === 'FRAUD') return 'bg-red-500/20 text-red-400 border border-red-500/40';
                if (level === 'MEDIUM' || level === 'SUSPICIOUS') return 'bg-amber-500/20 text-amber-400 border border-amber-500/40';
                return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
            };

            const getVoiceBadge = (vClass) => {
                if (vClass.includes('AI')) return 'bg-red-500/20 text-red-400 border border-red-500/40';
                if (vClass.includes('Human')) return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
                return 'bg-amber-500/20 text-amber-400 border border-amber-500/40';
            };

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Header */}
                    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">🛡️</span>
                            <div>
                                <h1 class="text-xl font-bold tracking-tight text-white">CAMP PROTECT</h1>
                                <p class="text-xs text-slate-400">AI Scam Shield & Voice Integrity Platform</p>
                            </div>
                        </div>
                        <div class="flex gap-2 text-xs">
                            <span class="px-3 py-1 bg-slate-800 rounded-full border border-slate-700">Database: SQLite (Active)</span>
                            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full">Server Status: Online</span>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div class="flex flex-wrap justify-center bg-slate-950 border-b border-slate-900 px-6 py-3 gap-2 md:gap-4">
                        <button onClick={() => { setActiveTab('live'); setAnalysisResult(null); stopHighRiskAlarm(); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'live' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>🎙️ Live Mic Monitor</button>
                        <button onClick={() => { setActiveTab('audio'); setAnalysisResult(null); stopHighRiskAlarm(); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'audio' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>📁 Upload Audio File</button>
                        <button onClick={() => { setActiveTab('transcript'); setAnalysisResult(null); stopHighRiskAlarm(); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'transcript' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>📝 Paste Transcript</button>
                        <button onClick={() => { setActiveTab('history'); stopHighRiskAlarm(); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'history' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>📊 Call Logs & History</button>
                        <button onClick={() => { setActiveTab('analytics'); stopHighRiskAlarm(); }} class={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'analytics' ? 'bg-slate-800 text-white shadow-lg border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}>📈 System Analytics</button>
                    </div>

                    {/* Main Layout Grid */}
                    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

                        {/* LEFT: Input Column */}
                        <div class="lg:col-span-7 flex flex-col gap-6">

                            {/* Tab 1: Live Mic Monitor */}
                            {activeTab === 'live' && (
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                                    <h2 class="text-lg font-bold">🎙️ Continuous Offline Speech Monitoring</h2>
                                    <p class="text-sm text-slate-400">
                                        Click <strong>Start Monitoring</strong> and speak in Hindi or English (mixed Hinglish supported). The offline AI scanner will transcribe your voice and check threat metrics in real-time.
                                    </p>

                                    {isCallTerminated && (
                                        <div class="p-4 bg-red-950/80 border border-red-500 text-red-400 rounded-xl flex items-center gap-3 animate-pulse">
                                            <span class="text-2xl">🚨</span>
                                            <div>
                                                <h3 class="text-sm font-extrabold uppercase tracking-wider">CALL TERMINATED AUTOMATICALLY</h3>
                                                <p class="text-xs text-red-400/80 mt-1">Scam threat reached 100%. System automatically hung up to protect the user.</p>
                                            </div>
                                        </div>
                                    )}

                                    <div class="flex items-center gap-4 mt-2">
                                        <button onClick={toggleMic} class={`flex-1 py-4 px-6 rounded-xl font-bold flex items-center justify-center gap-3 transition-all ${isListening ? 'bg-red-500 hover:bg-red-600 text-white animate-pulse' : 'bg-blue-500 hover:bg-blue-600 text-slate-950'}`}>
                                            <span>{isListening ? '⏹️ Stop Monitoring' : '🎙️ Start Monitoring'}</span>
                                        </button>
                                        <span class={`px-3 py-1 rounded-full text-xs font-bold ${isListening ? 'bg-red-500/20 text-red-400' : 'bg-slate-800 text-slate-400'}`}>
                                            {isListening ? '● SCANNING' : '● IDLE'}
                                        </span>
                                    </div>

                                    {/* Mic Live Transcript Viewer */}
                                    <div class="mt-4">
                                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Live Transcript View</h3>
                                        <div class="bg-slate-950 rounded-xl p-4 h-64 overflow-y-auto border border-slate-900 flex flex-col gap-2">
                                            {micTranscript.length === 0 ? (
                                                <div class="text-slate-600 text-center py-20 text-sm">Waiting for speech... Speak now!</div>
                                            ) : (
                                                micTranscript.map((t, idx) => (
                                                    <div key={idx} class="text-sm border-l-2 border-slate-700 pl-3 py-1 text-slate-300">"{t}"</div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Tab 2: Upload Audio File */}
                            {activeTab === 'audio' && (
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                                    <div class="flex items-center justify-between">
                                        <h2 class="text-lg font-bold">📁 Batch Speech-to-Text & Voice Analysis</h2>
                                        <span class="px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/30 text-xs font-bold">New: AI Voice Detection Included</span>
                                    </div>
                                    <p class="text-sm text-slate-400">Upload recorded call files (.wav, .mp3, .m4a) to decode audio features, verify speech patterns, and classify human vs AI voices.</p>

                                    <form onSubmit={(e) => handleAnalyzeAudio(e, null)} class="flex flex-col gap-4">
                                        <div
                                            onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('border-emerald-500'); }}
                                            onDragLeave={(e) => { e.preventDefault(); e.currentTarget.classList.remove('border-emerald-500'); }}
                                            onDrop={(e) => {
                                                e.preventDefault();
                                                e.currentTarget.classList.remove('border-emerald-500');
                                                const file = e.dataTransfer.files[0];
                                                if (file) {
                                                    setAudioFile(file);
                                                    handleAnalyzeAudio(null, file);
                                                }
                                            }}
                                            class="border-2 border-dashed border-slate-700 hover:border-slate-500 rounded-xl p-8 flex flex-col items-center justify-center gap-2 cursor-pointer transition-all bg-slate-950/40"
                                        >
                                            <span class="text-4xl mb-2">📥</span>
                                            <input type="file" accept="audio/*" onChange={(e) => {
                                                const file = e.target.files[0];
                                                if (file) {
                                                    setAudioFile(file);
                                                    handleAnalyzeAudio(null, file);
                                                }
                                            }} class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700" />
                                            <span class="text-xs text-slate-500">Supports WAV, MP3, M4A, OGG (Drag & Drop or Select File)</span>
                                        </div>

                                        <button type="submit" disabled={!audioFile || loading} class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition-all disabled:opacity-50">
                                            {loading ? 'Processing Audio Pipeline...' : 'Select or drop a file to automatically detect voice integrity'}
                                        </button>
                                    </form>
                                </div>
                            )}

                            {/* Tab 3: Paste Transcript */}
                            {activeTab === 'transcript' && (
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                                    <h2 class="text-lg font-bold">📝 Pasted Transcript Evaluation</h2>
                                    <p class="text-sm text-slate-400">Select one of our pre-compiled scam templates or write/paste a custom transcript.</p>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-2">
                                        {DEMO_TRANSCRIPTS.map((demo, idx) => (
                                            <button key={idx} onClick={() => { setPastedText(demo.text); handleAnalyzeText(demo.text); }} class="text-left px-3 py-2 bg-slate-950/40 border border-slate-800 rounded-lg hover:bg-slate-800 text-xs font-medium transition-all text-slate-300">
                                                🎯 {demo.title}
                                            </button>
                                        ))}
                                    </div>

                                    <textarea value={pastedText} onChange={(e) => setPastedText(e.target.value)} placeholder="Type or paste the transcript conversation here..." class="w-full h-40 bg-slate-950 rounded-xl p-4 text-sm text-slate-300 border border-slate-800 focus:outline-none focus:border-slate-700 focus:ring-0 resize-none"></textarea>

                                            <div>
                                                <div class="text-[10px] text-slate-500 uppercase">Classification</div>
                                                <div class="text-sm font-bold text-slate-200 mt-0.5">{selectedCall.voiceClassification}</div>
                                            </div>
                                            <div class="text-right">
                                                <div class="text-[10px] text-slate-500 uppercase">Confidence</div>
                                                <div class="text-sm font-bold text-amber-400 mt-0.5">{selectedCall.voiceConfidence}%</div>
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-2 gap-2 text-xs">
                                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-900">
                                                <div class="text-emerald-400 font-bold">Human probability: {selectedCall.humanVoiceProbability}%</div>
                                            </div>
                                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-900">
                                                <div class="text-red-400 font-bold">AI Probability: {selectedCall.aiVoiceProbability}%</div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div class="bg-slate-950 p-3 rounded-lg border border-slate-900 text-center text-xs text-slate-500">
                                        Voice Analysis not available for this record (text-only evaluation).
                                    </div>
                                )}

                                <div class="bg-slate-950 p-4 border border-slate-900 rounded-xl">
                                    <span class="text-xs font-bold text-slate-400 uppercase block mb-1.5">Transcript Record</span>
                                    <p class="text-sm text-slate-300 leading-relaxed font-mono">"{selectedCall.transcript || 'No transcript text logged.'}"</p>
                                </div>

                                <div class="flex justify-end gap-2 border-t border-slate-800 pt-3">
                                    <button onClick={() => setSelectedCall(null)} class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-lg text-sm">Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500">
                        <p>Camp Protect AI Scam Shield — Engineering Final Year Project. Designed Compliance-First under Android 10-15 Regulations.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
